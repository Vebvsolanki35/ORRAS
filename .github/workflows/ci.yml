name: CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run module self-tests
        run: python orras_cli.py selftest

      - name: Run test suite
        run: python tests/run_all.py

      - name: Smoke-test the CLI
        run: |
          python orras_cli.py health --out /tmp/health.json
          python orras_cli.py sitrep

  lint:
    name: Syntax & import check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Compile every module
        run: python -m compileall -q .

      - name: Import every module
        run: |
          python - <<'PY'
          import importlib, pathlib, sys

          skip = {"app"}  # Streamlit entry point needs a runtime context
          modules = [
              p.stem for p in pathlib.Path(".").glob("*.py")
              if p.stem not in skip and not p.stem.startswith("_")
          ]
          failures = []
          for name in modules:
              try:
                  importlib.import_module(name)
              except Exception as exc:
                  failures.append(f"{name}: {type(exc).__name__}: {exc}")

          if failures:
              print("\n".join(failures))
              sys.exit(1)
          print(f"Imported {len(modules)} modules successfully.")
          PY
